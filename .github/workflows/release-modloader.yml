name: Release ModLoader

# 每次打 modloader-* tag 或手动触发时:
# 分为两个独立流程并行执行:
#   1) 构建加载器和mods (Build Loader & Mods): 构建原生 version.dll 与全部内置 mod、打包分发 zip 与默认皮肤包
#   2) 构建cesiumcli (Build Cesium CLI): 构建 SDK、cesium.exe 单文件与 apcsm dotnet tool 包
# 全部通过后由 release 作业原子汇总发布 GitHub Release 并通过 OIDC Trusted Publishing 推送 NuGet。

on:
  push:
    tags:
      - "modloader-*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  SOLUTION: CesiumLoader.sln
  APP_NAME: cesium-loader
  # AI agent 接管(AstralParty.AgentMod + AstralParty.Mcp.exe)是实验性、真机没验完的可选能力,
  # 默认不产出 cesium-agent-mcp*.zip；Release 必需资产为加载器、默认皮肤与 SDK 工具包。
  # 想重新发这个包: 把这里改成 'true'。
  PUBLISH_AGENT_PACKAGE: 'false'

jobs:
  # =========================================================================
  # 流程一: 构建加载器和mods (Build Loader & Mods)
  # =========================================================================
  build-loader:
    name: Build Loader & Mods
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}" -replace '^modloader-', ''
          } else {
            "manual-${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify game reference assemblies
        shell: pwsh
        run: |
          $manifest = Get-Content "refs/game/sources.json" -Raw | ConvertFrom-Json
          $assemblies = @($manifest.assemblies.PSObject.Properties)
          if ($assemblies.Count -eq 0) { throw "refs/game/sources.json 没有列出程序集" }
          foreach ($assembly in $assemblies) {
            $path = "refs/game/$($assembly.Name)"
            if (-not (Test-Path -LiteralPath $path)) { throw "缺少游戏引用程序集: $path" }
            $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $assembly.Value) { throw "refs/game/$($assembly.Name) 与 sources.json 记录的哈希不一致" }
          }
          Write-Host "refs/game 完整: $($assemblies.Count) 个程序集 ($($manifest.baseline))"

      - name: Build loader and mod projects
        shell: pwsh
        run: |
          # 1) 原生加载器
          & msbuild loader\CesiumLoader\CesiumLoader.vcxproj /p:Configuration=Release /p:Platform=x64 /m /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vdbin = "loader/CesiumLoader/bin/Release/version.dll"
          if (-not (Test-Path $vdbin)) { throw "version.dll 未生成" }
          New-Item -ItemType Directory -Path "bin/Release" -Force | Out-Null
          Copy-Item $vdbin "bin/Release/version.dll" -Force
          $vdpdb = "loader/CesiumLoader/bin/Release/version.pdb"
          if (Test-Path $vdpdb) {
            Copy-Item $vdpdb "bin/Release/version.pdb" -Force
            Write-Host "version.pdb 已复制到 bin/Release/ ($((Get-Item $vdpdb).Length) bytes)"
          } else {
            Write-Warning "version.pdb 未生成: 本次发布包不含加载器符号"
          }

          # 2) 托管侧: 构建出货用的 csproj (loader/SDK/bootstrap/mods/mcp/CLI)。
          # tests\ 与 smoke\ 是测试与冒烟 harness, 只编不跑且不进 dist, 别浪费时间编它们。
          $projects = @(Get-ChildItem -Recurse -File -Filter *.csproj |
            Where-Object { $_.FullName -notmatch '\\(obj|bin|artifacts|staging|sdk-staging|agent-staging|tests|smoke)\\' } |
            Sort-Object FullName)
          if ($projects.Count -lt 20) { throw "只找到 $($projects.Count) 个 csproj, 检出内容不完整?" }
          $failed = @()
          foreach ($project in $projects) {
            $rel = $project.FullName.Substring((Get-Location).Path.Length + 1)
            Write-Host "== $rel"
            dotnet build $rel -c Release --nologo -v:minimal
            if ($LASTEXITCODE -ne 0) { $failed += $rel }
          }
          if ($failed.Count -gt 0) { throw "构建失败: $($failed -join ', ')" }
          Write-Host "已构建 $($projects.Count) 个托管项目"

      - name: Stage distribution layout
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/stage-modloader-dist.ps1 -NativeDll bin/Release/version.dll -Configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify dist prerequisites
        shell: pwsh
        run: |
          $builtInMods = @(Get-Content "tools/builtin-mods.json" -Raw | ConvertFrom-Json)
          if ($builtInMods.Count -eq 0) { throw "tools/builtin-mods.json 里没有内置 mod" }
          $required = @(
            "dist/modloader/AstralParty_ModLoader/bootstrap/CesiumLoader.Bootstrap.dll",
            "dist/modloader/AstralParty_ModLoader/doorstop_config.json",
            "dist/modloader/AstralParty_ModLoader/sdk/CesiumLoader.SDK.dll",
            "dist/modloader/AstralParty_ModLoader/sdk/CesiumLoader.SDK.xml"
          )
          foreach ($mod in $builtInMods) {
            $required += "dist/modloader/AstralParty_ModLoader/mods/$mod/$mod.dll"
            $required += "dist/modloader/AstralParty_ModLoader/mods/$mod/$mod.json"
          }
          foreach ($f in $required) { if (-not (Test-Path $f)) { throw "缺少构建产物: $f" } }

          [xml] $sdkDocs = Get-Content "dist/modloader/AstralParty_ModLoader/sdk/CesiumLoader.SDK.xml" -Raw
          $sdkMembers = @($sdkDocs.doc.members.member)
          if ($sdkMembers.Count -lt 100) { throw "SDK XML 文档成员过少: $($sdkMembers.Count)" }
          if (-not ($sdkMembers | Where-Object { $_.name -like 'T:CesiumLoader.SDK.*' })) {
            throw "SDK XML 文档缺少 CesiumLoader.SDK 类型注释"
          }
          Write-Host "SDK XML 文档: $($sdkMembers.Count) 个成员"
          Write-Host "dist 构建产物齐全: $($builtInMods -join ', ')"

          $symbols = @("dist/modloader/AstralParty_ModLoader/sdk/CesiumLoader.SDK.pdb")
          foreach ($mod in $builtInMods) { $symbols += "dist/modloader/AstralParty_ModLoader/mods/$mod/$mod.pdb" }
          $missingSymbols = @($symbols | Where-Object { -not (Test-Path $_) })
          if ($missingSymbols.Count -gt 0) {
            Write-Warning "dist 缺符号(本次发布包不含它们): $($missingSymbols -join ', ')"
          } else {
            Write-Host "dist 符号齐全: $($symbols.Count) 个 .pdb"
          }

      - name: Stage deployment layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "staging/AstralParty_ModLoader/sdk", "staging/AstralParty_ModLoader/mods", "staging/AstralParty_ModLoader/logs", "staging/AstralParty_ModLoader/bootstrap" -Force | Out-Null
          Copy-Item "bin/Release/version.dll" "staging/version.dll" -Force
          Copy-Item "CesiumLoader-NOTICE.txt" "staging/CesiumLoader-NOTICE.txt" -Force
          Copy-Item "LICENSE" "staging/CesiumLoader-LICENSE.txt" -Force
          Copy-Item "CesiumLoader-NOTICE.txt" "staging/AstralParty_ModLoader/CesiumLoader-NOTICE.txt" -Force
          Copy-Item "LICENSE" "staging/AstralParty_ModLoader/CesiumLoader-LICENSE.txt" -Force
          Copy-Item "dist/modloader/AstralParty_ModLoader/doorstop_config.json" "staging/AstralParty_ModLoader/doorstop_config.json" -Force
          Copy-Item "dist/modloader/AstralParty_ModLoader/bootstrap/CesiumLoader.Bootstrap.dll" "staging/AstralParty_ModLoader/bootstrap/CesiumLoader.Bootstrap.dll" -Force
          Copy-Item "dist/modloader/AstralParty_ModLoader/sdk/CesiumLoader.SDK.dll" "staging/AstralParty_ModLoader/sdk/CesiumLoader.SDK.dll" -Force
          Copy-Item "dist/modloader/AstralParty_ModLoader/sdk/CesiumLoader.SDK.xml" "staging/AstralParty_ModLoader/sdk/CesiumLoader.SDK.xml" -Force

          foreach ($p in @(
              @{ From = "bin/Release/version.pdb";                                                              To = "staging/version.pdb" },
              @{ From = "dist/modloader/AstralParty_ModLoader/bootstrap/CesiumLoader.Bootstrap.pdb";           To = "staging/AstralParty_ModLoader/bootstrap/CesiumLoader.Bootstrap.pdb" },
              @{ From = "dist/modloader/AstralParty_ModLoader/sdk/CesiumLoader.SDK.pdb";                       To = "staging/AstralParty_ModLoader/sdk/CesiumLoader.SDK.pdb" }
            )) {
            if (Test-Path $p.From) { Copy-Item $p.From $p.To -Force } else { Write-Warning "符号缺失, 本次发布不含: $($p.From)" }
          }

          $builtInMods = @(Get-Content "tools/builtin-mods.json" -Raw | ConvertFrom-Json)
          $modNames = @{
            "ActivityLogMod" = "行为日志"
            "FreeCameraMod"  = "自由相机, 滚轮缩放(视角不变) / F1 恢复原视角"
            "SpeedHackMod"   = "变速, Delete 开关 / Alt+= Alt+- 调倍率"
            "TurnFocusMod"   = "回合置前, 轮到自己时把游戏窗口切到前台, 可选播放提示音"
            "HideHudMod"     = "隐藏HUD, 长按反引号(Tab 上方)隐藏战斗 HUD, 可改为按一下切换"
            "QuickChatPlusMod" = "快捷短语扩展, 战斗内快捷短语补全并支持滚动"
            "ChatDurationMod" = "消息停留时间, 战斗消息与表情按真实时间停留, 不受变速影响"
            "HomeBottomBarMod" = "主页底栏调整, 隐藏公告 / 设置左移 / 右侧增加退出按钮"
            "UnlockFrameRateMod" = "帧率解锁, 帧率列表追加 144/165/240/360/不限帧"
            "LanguageUnlockMod" = "多语言支持, 国服启用英文/日文/繁中语言选项"
          }
          $modList = @()
          foreach ($mod in $builtInMods) {
            New-Item -ItemType Directory -Path "staging/AstralParty_ModLoader/mods/$mod" -Force | Out-Null
            Copy-Item "dist/modloader/AstralParty_ModLoader/mods/$mod/$mod.dll" "staging/AstralParty_ModLoader/mods/$mod/$mod.dll" -Force
            Copy-Item "dist/modloader/AstralParty_ModLoader/mods/$mod/$mod.json" "staging/AstralParty_ModLoader/mods/$mod/$mod.json" -Force
            if (Test-Path "dist/modloader/AstralParty_ModLoader/mods/$mod/$mod.pdb") {
              Copy-Item "dist/modloader/AstralParty_ModLoader/mods/$mod/$mod.pdb" "staging/AstralParty_ModLoader/mods/$mod/$mod.pdb" -Force
            } else {
              Write-Warning "符号缺失, 本次发布不含: mods/$mod/$mod.pdb"
            }
            if (Test-Path "dist/modloader/AstralParty_ModLoader/mods/$mod/sounds") {
              Copy-Item "dist/modloader/AstralParty_ModLoader/mods/$mod/sounds" "staging/AstralParty_ModLoader/mods/$mod/sounds" -Recurse -Force
            }
            if (Test-Path "dist/modloader/AstralParty_ModLoader/mods/$mod/data") {
              Copy-Item "dist/modloader/AstralParty_ModLoader/mods/$mod/data" "staging/AstralParty_ModLoader/mods/$mod/data" -Recurse -Force
            }
            $label = if ($modNames.ContainsKey($mod)) { $modNames[$mod] } else { $mod }
            $modList += "mods\$mod ($label)"
          }

          $readme = @(
            "cesium-loader-${{ steps.version.outputs.version }}",
            "- version.dll                          → 复制到游戏 exe 目录 (Doorstop 式代理加载器)",
            "- AstralParty_ModLoader\doorstop_config.json → 加载器配置 (enabled=false 可完全禁用)",
            "- AstralParty_ModLoader\bootstrap\     → 托管引导程序 (先于 SDK/mods 加载)",
            "- AstralParty_ModLoader\sdk\           → SDK 依赖",
            "- AstralParty_ModLoader\mods\          → 用户 mod (每 mod 一个文件夹: mods\{ModId}\{ModId}.dll)",
            "- AstralParty_ModLoader\mods\{ModId}\{ModId}.json → mod sidecar (id/版本/权限/enabled 开关/依赖)",
            "- *.pdb (version / bootstrap / sdk / mods\*) → 符号文件(与同名 dll 配对): 把崩溃栈还原成文件行号用, 删掉不影响运行",
            "- AstralParty_ModLoader\sdk\CesiumLoader.SDK.xml → SDK 的 XML 文档(与 dll 同名): 写 mod 时 IDE 里可见类型/成员注释, 删掉不影响运行",
            "  随包内置: " + ($modList -join " / "),
            "TurnFocusMod 默认不播放提示音; 在 mods\TurnFocusMod\config.json 的 soundFile 填 WAV 路径后启用(随包示例 sounds\your-turn.wav)。",
            "AutoThanksMod 默认启用: 队友治疗、给牌或转星币给你时自动发送原版感谢短语，默认 2 秒真实时间冷却。",
            "HideHudMod 默认启用: 长按反引号键（Tab 上方）隐藏战斗 HUD，松开恢复；可在 config.json 改成按一下切换，并分别开关手牌、怪物信息、头像与其他 HUD。",
            "ChatDurationMod 默认启用: 战斗中的快捷消息与表情按真实时间停留 15 秒(可在 config.json 调整)，变速不会缩短停留时间。",
            "HomeBottomBarMod 默认启用: 主页底栏隐藏公告，设置左移一位，最右侧增加退出按钮（沿用游戏原生退出确认）。",
            "UnlockFrameRateMod 默认启用: 在游戏「设置→屏幕→帧率」列表追加 144/165/240/360/不限帧 选项，选中后由游戏自己应用。",
            "LanguageUnlockMod 默认启用: 国服在游戏「设置→屏幕→语言」里启用英文 / 日文 / 繁中；国际服原生支持，模组自动不介入。",
            "- AstralParty_ModLoader\logs\          → 日志目录",
            "- CesiumLoader-NOTICE.txt / CesiumLoader-LICENSE.txt → 版权声明与 AGPL-3.0 全文",
            "  (游戏 exe 目录与 AstralParty_ModLoader 各一份; 安装即表示同意该协议)",
            "解压到游戏 exe 目录即完成安装。",
            "默认皮肤单独提供: cesium-default-skins.zip，解压到同一游戏 exe 目录。",
            "加载器包包含 CardSkinMod，但不包含 skins；未安装皮肤时使用游戏原图。",
            "从旧版升级: 请删除游戏目录下的 winmm.dll (旧代理), 换成 version.dll。",
            "⚠ 与本加载器互斥: 旧版独立变速器也使用 version.dll(speedhack-rs) —— 不要同时安装!",
            "  CesiumLoader 已内置变速引擎(加载器功能, 非 mod): 改 doorstop_config.json 的",
            "  speedhackBaseSpeed 即可(2.0=全程2倍速, 1.0=正常), 或直接用 AstralParty.Toys 的模组页面开关。",
            "  游戏内实时调整: 内置 mod 变速(SpeedHackMod) —— Delete 开关, Alt+= / Alt+- 调倍率。"
          ) -join [Environment]::NewLine
          Set-Content -Path "staging/README.txt" -Value $readme -Encoding UTF8

      - name: Build manifest
        id: manifest
        shell: pwsh
        run: |
          $files = @(
            "staging/version.dll",
            "staging/version.pdb",
            "staging/CesiumLoader-NOTICE.txt",
            "staging/CesiumLoader-LICENSE.txt",
            "staging/AstralParty_ModLoader/CesiumLoader-NOTICE.txt",
            "staging/AstralParty_ModLoader/CesiumLoader-LICENSE.txt",
            "staging/AstralParty_ModLoader/doorstop_config.json",
            "staging/AstralParty_ModLoader/bootstrap/CesiumLoader.Bootstrap.dll",
            "staging/AstralParty_ModLoader/bootstrap/CesiumLoader.Bootstrap.pdb",
            "staging/AstralParty_ModLoader/sdk/CesiumLoader.SDK.dll",
            "staging/AstralParty_ModLoader/sdk/CesiumLoader.SDK.pdb",
            "staging/AstralParty_ModLoader/sdk/CesiumLoader.SDK.xml"
          )
          $builtInMods = @(Get-Content "tools/builtin-mods.json" -Raw | ConvertFrom-Json)
          foreach ($mod in $builtInMods) {
            $files += "staging/AstralParty_ModLoader/mods/$mod/$mod.dll"
            $files += "staging/AstralParty_ModLoader/mods/$mod/$mod.json"
            $files += "staging/AstralParty_ModLoader/mods/$mod/$mod.pdb"
            if (Test-Path "staging/AstralParty_ModLoader/mods/$mod/sounds") {
              $files += Get-ChildItem "staging/AstralParty_ModLoader/mods/$mod/sounds" -File |
                ForEach-Object { "staging/AstralParty_ModLoader/mods/$mod/sounds/$($_.Name)" }
            }
            if (Test-Path "staging/AstralParty_ModLoader/mods/$mod/data") {
              $files += Get-ChildItem "staging/AstralParty_ModLoader/mods/$mod/data" -File |
                ForEach-Object { "staging/AstralParty_ModLoader/mods/$mod/data/$($_.Name)" }
            }
          }
          $files = @($files | Where-Object { Test-Path $_ })
          $fileMap = @{}
          foreach ($f in $files) {
            $rel = $f.Substring("staging/".Length) -replace '\\', '/'
            $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLowerInvariant()
            $fileMap[$rel] = $hash
          }
          $manifest = [ordered]@{
            name      = "CesiumLoader"
            version   = "${{ steps.version.outputs.version }}"
            tag       = "${{ github.ref_name }}"
            repo      = "higashitaniyume/CesiumLoader"
            layout    = "game-dir"
            built_at  = (Get-Date).ToUniversalTime().ToString("o")
            files     = $fileMap
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path "staging/cesium-loader.json" -Encoding UTF8
          $symbols = @($fileMap.Keys | Where-Object { $_.EndsWith(".pdb") }).Count
          Write-Host "manifest: $($fileMap.Count) 个文件, 其中符号 $symbols 个"
          Get-Content "staging/cesium-loader.json"

      - name: Stage AI agent bridge package (optional add-on)
        shell: pwsh
        run: |
          if ($env:PUBLISH_AGENT_PACKAGE -ne 'true') {
            Write-Host "跳过 AI 接管包(实验性/未完成, 默认不发)。需要时把 workflow 顶部 env.PUBLISH_AGENT_PACKAGE 改成 'true'。"
            exit 0
          }
          $modSrc = "mcp/AstralParty.AgentMod"
          $modBin = "$modSrc/bin/Release/netstandard2.0"
          if (-not (Test-Path "$modBin/AstralParty.AgentMod.dll")) { throw "缺少构建产物: $modBin/AstralParty.AgentMod.dll" }
          if (-not (Test-Path "$modSrc/AstralParty.AgentMod.json")) { throw "缺少 sidecar: $modSrc/AstralParty.AgentMod.json" }

          dotnet publish mcp\AstralParty.Mcp\AstralParty.Mcp.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o agent-tools --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "agent-tools/AstralParty.Mcp.exe")) { throw "AstralParty.Mcp.exe 未生成" }

          New-Item -ItemType Directory -Path "agent-staging/mods/AstralParty.AgentMod", "agent-staging/docs" -Force | Out-Null
          Copy-Item "agent-tools/AstralParty.Mcp.exe" "agent-staging/AstralParty.Mcp.exe" -Force
          Copy-Item "$modBin/AstralParty.AgentMod.dll"  "agent-staging/mods/AstralParty.AgentMod/AstralParty.AgentMod.dll"  -Force
          Copy-Item "$modSrc/AstralParty.AgentMod.json" "agent-staging/mods/AstralParty.AgentMod/AstralParty.AgentMod.json" -Force
          if (Test-Path "$modBin/AstralParty.AgentMod.pdb") {
            Copy-Item "$modBin/AstralParty.AgentMod.pdb" "agent-staging/mods/AstralParty.AgentMod/AstralParty.AgentMod.pdb" -Force
          } else {
            Write-Warning "符号缺失, 本包不含 AstralParty.AgentMod.pdb"
          }
          Copy-Item "mcp/README.md" "agent-staging/docs/MCP-README.md" -Force

          $readme = @(
            "cesium-agent-mcp ${{ steps.version.outputs.version }} —— AI agent 接管《吉星派对》对局 (可选组件)",
            "",
            "这一包不属于加载器本体, 需要先装好 CesiumLoader(version.dll + AstralParty_ModLoader\)。",
            "",
            "安装:",
            "  1. AstralParty.Mcp.exe                     → 放任意目录(MCP server, 自包含无需 .NET 运行时)",
            "  2. mods\AstralParty.AgentMod\*.dll/.json(.pdb) → 整个文件夹复制到 <游戏exe目录>\AstralParty_ModLoader\mods\ 下",
            "  3. 启动游戏(桥接会自己建 %LocalAppData%\AstralParty_ModLoader\agent\)",
            "  4. 自检: AstralParty.Mcp.exe --print-config   (看到『心跳: 活着』即通)",
            "",
            "在 MCP 客户端(Claude Desktop 等)里配置:",
            '  { "mcpServers": { "astral-party": { "command": "<AstralParty.Mcp.exe 的完整路径>" } } }',
            "",
            "安全开关(control.json, 或用工具的 astral_control / astral_emergency_stop):",
            "  enableActions=false → 只读; pauseActions=true → 急停; dryRun=true → 只记录不发指令",
            "",
            "⚠ 服务器权威: agent 只能替你点合法的客户端操作, 不能改数值。",
            "   请只在自己的房间/账号上使用; 详见 mcp\README.md 的边界说明。",
            "卸载: 删除 AstralParty_ModLoader\mods\AstralParty.AgentMod\ 目录即可, 不影响加载器与其它 mod。"
          ) -join [Environment]::NewLine
          Set-Content -Path "agent-staging/README.txt" -Value $readme -Encoding UTF8

      - name: Package zip
        shell: pwsh
        run: |
          $zipName = "cesium-loader-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "staging/*" -DestinationPath $zipName -CompressionLevel Optimal
          Copy-Item $zipName "cesium-loader.zip" -Force
          if ($env:PUBLISH_AGENT_PACKAGE -eq 'true') {
            $agentZip = "cesium-agent-mcp-${{ steps.version.outputs.version }}.zip"
            Compress-Archive -Path "agent-staging/*" -DestinationPath $agentZip -CompressionLevel Optimal
            Copy-Item $agentZip "cesium-agent-mcp.zip" -Force
          } else {
            Write-Host "未生成 cesium-agent-mcp*.zip (PUBLISH_AGENT_PACKAGE != true)"
          }
          Get-ChildItem *.zip | Select-Object Name, Length

      - name: Package default skins and verify release assets
        shell: pwsh
        run: |
          & ./tools/package-default-skins.ps1 -Version "${{ steps.version.outputs.version }}" -OutputDir "."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload loader and skins artifacts
        uses: actions/upload-artifact@v4
        with:
          name: loader-artifacts
          path: |
            cesium-loader*.zip
            cesium-default-skins*.zip
            cesium-agent-mcp*.zip
          if-no-files-found: error
          retention-days: 1

  # =========================================================================
  # 流程二: 构建cesiumcli (Build Cesium CLI & apcsm Tool)
  # =========================================================================
  build-cli:
    name: Build Cesium CLI
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") {
            "${{ github.ref_name }}" -replace '^modloader-', ''
          } else {
            "manual-${{ github.run_number }}"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build SDK library & doc
        shell: pwsh
        run: |
          dotnet build loader/CesiumLoader.SDK/CesiumLoader.SDK.csproj -c Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sdkBin = "loader/CesiumLoader.SDK/bin/Release/netstandard2.0"
          if (-not (Test-Path "$sdkBin/CesiumLoader.SDK.dll")) { throw "CesiumLoader.SDK.dll 未生成" }
          if (-not (Test-Path "$sdkBin/CesiumLoader.SDK.xml")) { throw "CesiumLoader.SDK.xml 未生成" }
          Write-Host "CesiumLoader.SDK 构建成功"

      - name: Build SDK tools (cesium CLI)
        shell: pwsh
        run: |
          # cesium CLI: win-x64 自包含单文件(含 .NET 运行时, 开箱即用, 无需本机 dotnet)
          dotnet publish tools\cesium\CesiumCli.csproj -c Release -r win-x64 `
            --self-contained true -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true -o sdk-tools --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "sdk-tools/apcsm.exe") -and -not (Test-Path "sdk-tools/cesium.exe")) { throw "apcsm.exe / cesium.exe 未生成" }
          if (Test-Path "sdk-tools/apcsm.exe") {
            Write-Host "apcsm.exe 已构建: $((Get-Item 'sdk-tools/apcsm.exe').Length) bytes"
          } else {
            Write-Host "cesium.exe 已构建: $((Get-Item 'sdk-tools/cesium.exe').Length) bytes"
          }

      - name: Stage SDK tools package
        shell: pwsh
        run: |
          $sdkBin = "loader/CesiumLoader.SDK/bin/Release/netstandard2.0"
          New-Item -ItemType Directory -Path "sdk-staging/docs", "sdk-staging/examples/ActivityLogMod" -Force | Out-Null
          if (Test-Path "sdk-tools/apcsm.exe") {
            Copy-Item "sdk-tools/apcsm.exe" "sdk-staging/apcsm.exe" -Force
            Copy-Item "sdk-tools/apcsm.exe" "sdk-staging/cesium.exe" -Force
          } else {
            Copy-Item "sdk-tools/cesium.exe" "sdk-staging/apcsm.exe" -Force
            Copy-Item "sdk-tools/cesium.exe" "sdk-staging/cesium.exe" -Force
          }
          Copy-Item "$sdkBin/CesiumLoader.SDK.dll" "sdk-staging/CesiumLoader.SDK.dll" -Force
          Copy-Item "loader/CesiumLoader.SDK/LICENSE" "sdk-staging/LICENSE" -Force
          Copy-Item "$sdkBin/CesiumLoader.SDK.xml" "sdk-staging/CesiumLoader.SDK.xml" -Force
          if (Test-Path "$sdkBin/CesiumLoader.SDK.pdb") {
            Copy-Item "$sdkBin/CesiumLoader.SDK.pdb" "sdk-staging/CesiumLoader.SDK.pdb" -Force
          } else {
            Write-Warning "符号缺失, SDK 工具包不含 CesiumLoader.SDK.pdb"
          }
          git -c core.quotepath=false ls-files -- 'docs/*.md' | ForEach-Object { Copy-Item -LiteralPath $_ -Destination 'sdk-staging/docs/' -Force }
          if ($LASTEXITCODE -ne 0) { throw '无法枚举 SDK 文档' }
          Copy-Item "mods/ActivityLogMod/ModEntry.cs", "mods/ActivityLogMod/AssemblyInfo.cs", "mods/ActivityLogMod/ActivityLogMod.csproj" "sdk-staging/examples/ActivityLogMod/" -Force

          $readme = @(
            "cesium SDK 工具包 ${{ steps.version.outputs.version }}",
            "SDK 许可: LICENSE (MIT, 仅适用于 CesiumLoader.SDK 源码与程序集)",
            "其他工具、文档和示例按各自适用的许可使用；本工具包并非整体以 MIT 授权。",
            "",
            "包含:",
            "- apcsm.exe / cesium.exe → mod 脚手架与包分发 CLI (win-x64 自包含, 无需本机 .NET)",
            "- CesiumLoader.SDK.dll  → mod 开发引用 (编译期绑定; apcsm new 会自动附带进项目)",
            "- CesiumLoader.SDK.xml  → SDK 的 XML 文档 (与 dll 同名: IDE 里悬停/补全可见注释)",
            "- CesiumLoader.SDK.pdb  → SDK 符号 (调试时能单步进 SDK 内部并看到行号)",
            "- docs\                 → SDK 文档 (概览/事件/玩家/操作/变速/生命周期/配置/能力声明)",
            "- examples\ActivityLogMod\ → 示例 mod 源码 (行为日志, 最简单)",
            "",
            "快速开始:",
            "  apcsm new MyMod --author 你 --desc ""第一个mod""     # 生成项目模板(SDK 自动附带)",
            "  apcsm build MyMod                                    # 构建 (需本机 dotnet SDK)",
            "  apcsm package MyMod -o MyMod-1.0.0.zip               # 打包分发",
            "  apcsm verify <mods_dir>                              # 离线预检依赖/版本兼容",
            "  apcsm --help                                         # 全部命令与帮助",
            "",
            "提示: apcsm new 生成的项目自带 refs\CesiumLoader.SDK.dll, 开箱即构建;",
            "  mod 若直接用游戏类型(如 RoomInfo/Battle), 把游戏热更 DLL 放进 refs\ 即可自动引用。"
          ) -join [Environment]::NewLine
          Set-Content -Path "sdk-staging/README.txt" -Value $readme -Encoding UTF8

      - name: Package SDK tools zip
        shell: pwsh
        run: |
          $sdkZip = "cesium-sdk-tools-${{ steps.version.outputs.version }}.zip"
          Compress-Archive -Path "sdk-staging/*" -DestinationPath $sdkZip -CompressionLevel Optimal
          Copy-Item $sdkZip "cesium-sdk-tools.zip" -Force
          Get-ChildItem *.zip | Select-Object Name, Length

      - name: Pack apcsm dotnet tool
        shell: pwsh
        run: |
          dotnet pack tools\cesium\CesiumCli.csproj -c Release -p:Version=${{ steps.version.outputs.version }} -o . --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem *.nupkg | Select-Object Name, Length

      - name: Upload cli artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cli-artifacts
          path: |
            cesium-sdk-tools*.zip
            apcsm*.nupkg
          if-no-files-found: error
          retention-days: 1

  # =========================================================================
  # 流程三: 汇总发布 GitHub Release & NuGet (Release & Publish)
  # =========================================================================
  release:
    name: Create release & publish NuGet
    if: github.ref_type == 'tag'   # 手动 dispatch 只构建打包, 不创建 release
    needs: [build-loader, build-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download loader and skins artifacts
        uses: actions/download-artifact@v4
        with:
          name: loader-artifacts
          path: artifacts

      - name: Download cli artifacts
        uses: actions/download-artifact@v4
        with:
          name: cli-artifacts
          path: artifacts

      - name: List and verify artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la artifacts/
          version="${GITHUB_REF_NAME#modloader-}"
          for package in cesium-loader cesium-default-skins cesium-sdk-tools; do
            test -s "artifacts/$package.zip"
            test -s "artifacts/$package-$version.zip"
          done
          test -s "artifacts/apcsm.$version.nupkg"
          echo "全部资产校验通过!"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/*
          generate_release_notes: false
          fail_on_unmatched_files: true
          # 3.5.1 / 3.5.2 是修复候选, 在 GitHub 上标为 prerelease(不作为 Latest)。
          prerelease: ${{ github.ref_name == 'modloader-3.5.1' || github.ref_name == 'modloader-3.5.2' }}

      - name: NuGet login (OIDC Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish apcsm to NuGet.org
        shell: bash
        run: |
          dotnet nuget push artifacts/apcsm.*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
            --skip-duplicate
